[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cann-analyze"
version = "0.1.0"
description = "Thin log collection and versioned log-site locator for CANN/Ascend"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CANN-Analyze" }]

[project.scripts]
cann-analyze = "cann_analyze.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
